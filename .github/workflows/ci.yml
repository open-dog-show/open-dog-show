name: CI

on:
    push:
        branches: ['**']
    pull_request:
        branches: ['**']

jobs:
    ci:
        name: Install → Lint → Unit tests
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4

            - uses: pnpm/action-setup@v4
              with:
                  version: 9

            - uses: actions/setup-node@v4
              with:
                  node-version: '22'
                  cache: 'pnpm'

            - name: Install
              run: pnpm install --frozen-lockfile

            - name: Lint
              run: pnpm lint

            - name: Unit tests
              run: pnpm test

    integration:
        name: Integration tests (Postgres via Docker)
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4

            - uses: pnpm/action-setup@v4
              with:
                  version: 9

            - uses: actions/setup-node@v4
              with:
                  node-version: '22'
                  cache: 'pnpm'

            - name: Install
              run: pnpm install --frozen-lockfile

            - name: Integration tests
              run: pnpm test:integration

    notice-check:
        name: Notice completeness and licence compliance
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4

            - uses: pnpm/action-setup@v4
              with:
                  version: 9

            - uses: actions/setup-node@v4
              with:
                  node-version: '22'
                  cache: 'pnpm'

            - name: Install
              run: pnpm install --frozen-lockfile

            - name: Check NOTICE
              run: pnpm notice-check

    smoke:
        name: Generator smoke (plop + Postgres)
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4

            - uses: pnpm/action-setup@v4
              with:
                  version: 9

            - uses: actions/setup-node@v4
              with:
                  node-version: '22'
                  cache: 'pnpm'

            - name: Install
              run: pnpm install --frozen-lockfile

            - name: Generate smoke-test context
              run: pnpm new:context smoke-test

            - name: Link generated workspace package
              run: pnpm install --no-frozen-lockfile

            - name: Run generated integration test
              run: pnpm exec vitest run --config vitest.integration.config.ts packages/contexts/smoke-test
